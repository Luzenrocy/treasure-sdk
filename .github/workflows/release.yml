name: Release SDK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER || github.repository_owner }}
      GITEE_REPO: ${{ vars.GITEE_REPO || github.event.repository.name }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag version
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${RELEASE_TAG#v}"
          test "$package_version" = "$tag_version"

      - name: Verify, build, and pack SDK
        run: |
          npm run typecheck
          npm run pack:check
          mkdir release-assets
          npm pack --pack-destination release-assets
          (cd release-assets && sha256sum *.tgz > SHA256SUMS.txt)

      - name: Create GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Treasure SDK ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Publish public npm package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tarball in release-assets/*.tgz; do
            npm publish "./${tarball}" --access public --registry=https://npm.pkg.github.com
          done

      # GitHub Packages creates personal-account packages as private by default.
      # A classic PAT is required for the package-settings API used to make the
      # first published version publicly visible.
      - name: Make GitHub Package public
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          : "${GH_TOKEN:?Set GH_PACKAGES_TOKEN (classic PAT with package admin permission).}"
          gh api --method PATCH \
            "/user/packages/npm/%40luzenrocy%2Ftreasure-sdk" \
            -f visibility=public

      - name: Mirror release assets to Gitee
        shell: bash
        run: |
          set -euo pipefail
          : "${GITEE_TOKEN:?Set the GITEE_TOKEN repository secret before releasing.}"
          api="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          # The GitHub-to-Gitee pull mirror must contain this commit before a
          # Gitee Release can use it as target_commitish.
          for attempt in $(seq 1 90); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${api}/commits/${GITHUB_SHA}?access_token=${GITEE_TOKEN}")
            if [ "$status" = "200" ]; then
              break
            fi
            if [ "$attempt" = "90" ]; then
              echo "Gitee has not mirrored ${GITHUB_SHA} after 15 minutes (last HTTP status: ${status})."
              exit 1
            fi
            sleep 10
          done
          payload=$(curl --silent --show-error --request POST \
            --data-urlencode "tag_name=${RELEASE_TAG}" \
            --data-urlencode "name=Treasure SDK ${RELEASE_TAG}" \
            --data-urlencode "body=Mirrored from https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --data-urlencode "target_commitish=${GITHUB_SHA}" \
            "${api}/releases?access_token=${GITEE_TOKEN}")
          release_id=$(jq -er '.id // empty' <<<"$payload" || true)
          if [ -z "$release_id" ]; then
            payload=$(curl --fail-with-body --silent --show-error \
              "${api}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}")
            release_id=$(jq -er '.id' <<<"$payload")
          fi
          for asset in release-assets/*; do
            curl --fail-with-body --silent --show-error --request POST \
              --form "file=@${asset}" \
              "${api}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}"
          done
