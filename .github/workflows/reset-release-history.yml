name: Delete historical release history

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE_HISTORICAL_RELEASES to delete only the reviewed GitHub tags and Releases
        required: true
        type: string
      gitee_mirrors_paused:
        description: Type GITEE_MIRRORS_PAUSED after pausing the Gitee Pull mirror
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-reviewed-history:
    if: ${{ inputs.confirmation == 'DELETE_HISTORICAL_RELEASES' && inputs.gitee_mirrors_paused == 'GITEE_MIRRORS_PAUSED' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete reviewed GitHub Releases and assets
        run: |
          set -euo pipefail
          for tag in v1.0.6 v1.0.7 v1.0.8 v2.0.0 v2.1.0 v2.1.1 v2.2.0 v2.3.0 v2.3.1 v3.0.0; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - name: Delete reviewed GitHub tags
        run: |
          set -euo pipefail
          for tag in v1.0.3 v1.0.4 v1.0.5 v1.0.6 v1.0.7 v1.0.8 v2.0.0 v2.1.0 v2.1.1 v2.2.0 v2.3.0 v2.3.1 v3.0.0; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              git push origin ":refs/tags/${tag}"
            fi
          done
